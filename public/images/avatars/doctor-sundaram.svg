<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-sundaram" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="coat-sundaram" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <filter id="shadow-sundaram" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="48" fill="url(#bg-grad-sundaram)" />
  <circle cx="200" cy="200" r="160" fill="#4338ca" opacity="0.1" />

  <!-- Body & Doctor Attire -->
  <g filter="url(#shadow-sundaram)">
    <!-- Inner Shirt & Crimson Tie -->
    <path d="M150 250 L250 250 L240 370 L160 370 Z" fill="#38bdf8" />
    <polygon points="192,250 208,250 204,330 200,345 196,330" fill="#dc2626" />
    <polygon points="190,250 210,250 206,265 194,265" fill="#b91c1c" />

    <!-- White Clinical Coat -->
    <path d="M110 390 L110 320 C110 270 145 250 175 250 L200 330 L165 390 Z" fill="url(#coat-sundaram)" />
    <path d="M290 390 L290 320 C290 270 255 250 225 250 L200 330 L235 390 Z" fill="url(#coat-sundaram)" />
    <!-- Shoulders -->
    <path d="M70 390 C70 300 110 260 160 250 L140 390 Z" fill="#e2e8f0" />
    <path d="M330 390 C330 300 290 260 240 250 L260 390 Z" fill="#e2e8f0" />

    <!-- Cardiology Stethoscope -->
    <path d="M145 260 C145 320 165 350 190 350" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" />
    <path d="M255 260 C255 320 235 350 210 350" fill="none" stroke="#dc2626" stroke-width="8" stroke-linecap="round" />
    <circle cx="200" cy="355" r="14" fill="#1e293b" stroke="#ffffff" stroke-width="3" />
    <circle cx="200" cy="355" r="6" fill="#dc2626" />
  </g>

  <!-- Neck -->
  <path d="M175 200 L225 200 L230 260 L170 260 Z" fill="#c47d4e" />

  <!-- Head & Face -->
  <ellipse cx="200" cy="175" rx="55" ry="65" fill="#d98956" />

  <!-- Ears -->
  <circle cx="145" cy="175" r="14" fill="#c47d4e" />
  <circle cx="255" cy="175" r="14" fill="#c47d4e" />

  <!-- Distinguished Hair with Temple Highlights -->
  <path d="M145 160 C140 115 165 95 200 95 C235 95 260 115 255 160 C250 125 235 110 200 110 C165 110 150 125 145 160 Z" fill="#1e293b" />
  <path d="M147 145 C152 130 165 120 180 115 C165 120 152 132 147 145 Z" fill="#94a3b8" />
  <path d="M253 145 C248 130 235 120 220 115 C235 120 248 132 253 145 Z" fill="#94a3b8" />

  <!-- Eyebrows -->
  <path d="M165 152 Q180 148 190 152" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />
  <path d="M210 152 Q220 148 235 152" fill="none" stroke="#0f172a" stroke-width="3.5" stroke-linecap="round" />

  <!-- Eyes & Refined Glasses -->
  <circle cx="178" cy="165" r="5" fill="#0f172a" />
  <circle cx="222" cy="165" r="5" fill="#0f172a" />
  <circle cx="180" cy="163" r="1.5" fill="#ffffff" />
  <circle cx="224" cy="163" r="1.5" fill="#ffffff" />

  <rect x="160" y="152" width="34" height="24" rx="6" fill="none" stroke="#475569" stroke-width="2.5" />
  <rect x="206" y="152" width="34" height="24" rx="6" fill="none" stroke="#475569" stroke-width="2.5" />
  <line x1="194" y1="162" x2="206" y2="162" stroke="#475569" stroke-width="2.5" />

  <!-- Nose & Reassuring Smile -->
  <path d="M197 168 L197 185 Q200 188 204 185" fill="none" stroke="#a35b2e" stroke-width="2.5" stroke-linecap="round" />
  <path d="M185 204 Q200 214 215 204" fill="none" stroke="#7c2d12" stroke-width="3" stroke-linecap="round" />

  <!-- Cardiology ECG Badge -->
  <g transform="translate(130, 310)">
    <rect width="36" height="42" rx="6" fill="#ffffff" stroke="#dc2626" stroke-width="2" />
    <!-- Pulse Line -->
    <path d="M6 21 L12 21 L15 13 L18 28 L22 17 L24 21 L30 21" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="12" y="32" width="12" height="2" fill="#fca5a5" />
  </g>

  <!-- FACC Fellow Emblem -->
  <g transform="translate(245, 310)">
    <circle cx="16" cy="16" r="15" fill="#312e81" stroke="#ffffff" stroke-width="2" />
    <text x="16" y="20" font-family="system-ui, sans-serif" font-size="9" font-weight="900" fill="#ffffff" text-anchor="middle">FACC</text>
  </g>
</svg>
