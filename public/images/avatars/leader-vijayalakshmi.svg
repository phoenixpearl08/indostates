  <path d="M142 165 C138 115 165 95 200 95 C235 95 262 115 258 165 C264 210 252 245 245 250 C240 220 242 190 242 170 C242 125 225 110 200 110 C175 110 158 125 158 170 C158 190 160 220 155 250 C148 245 136 210 142 165 Z" fill="#0f172a" />
  <ellipse cx="200" cy="98" rx="35" ry="12" fill="#1e293b" />

