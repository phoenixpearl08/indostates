    <linearGradient id="sari-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>
  </defs>

  <rect width="400" height="400" rx="48" fill="url(#bg-grad-viji)" />
  <circle cx="200" cy="200" r="160" fill="#06b6d4" opacity="0.08" />

